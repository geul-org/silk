required:
  feature:
    archive: "pack 아카이브 열기 — 세트(최신 세대), 데이터 pack 파일, pack별 버전 문서 목록. 무압축 레코드만 받는다 (gogeul pkg/pack 위)"
    recmap: "정렬된 레코드 맵 — pack·Issuer마다 (Kind·Codec, 오프셋) 순 off[] u32와 key 구간 표·문서 표, 디스크 형식 쓰기·읽기(ReadAt)·검증"
    index: "색인 디렉터리 — 아카이브의 모든 pack·Issuer에 레코드 맵을 만들고, 열고(세대 확인), 검증한다"
    scan: "융합 루프 스캔 — 맵의 오프셋 구간을 다중 스레드로 읽으며 레코드 바이트를 술어로 거른다 (TAG WORD 건너뛰기)"
    sig: "개체 서명 — 선언한 폭과 필드(열거·원핫·블룸·접두·구간 버킷) 스키마, 인코더, 마스크·패턴 스캔"
    query: "질의 — 조건 묶음 파싱, 계획(서명 필터 → 레코드 맵 스캔 → 정밀 확인), 실행 결과(문서·Edge Id)"
    cli: "silk 명령줄 도구 — 인자 해석과 출력만(로직은 pkg)"
    fixture: "테스트 픽스처 — testdata 디렉터리 아카이브를 임시 pack 세트로 만든다"
  type:
    model: "data type definition"
    reader: "파일·pack에서 읽어 구조로"
    writer: "구조를 파일로 쓴다"
    encoder: "structure → binary"
    decoder: "binary → structure"
    builder: "입력에서 맵·결과 구조를 만든다"
    scanner: "레코드·서명 스캔 루프"
    matcher: "레코드·서명 하나를 조건과 맞춘다"
    rule: "검증 규칙"
    helper: "internal utility function"
    command: "명령 엔트리포인트"

